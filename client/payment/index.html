<script>
(function () {
  function fire() {
    if (location.pathname.indexOf('/payment/final-page') === 0 && !sessionStorage.getItem('snapPurchase')) {
      sessionStorage.setItem('snapPurchase', '1');
      snaptr('track', 'PURCHASE', {
        price: Number(localStorage.getItem('Total') || 0),
        currency: 'KWD',
        num_items: 1
      });
    }
  }
  ['pushState', 'replaceState'].forEach(function (m) {
    var orig = history[m];
    history[m] = function () { orig.apply(this, arguments); fire(); };
  });
  window.addEventListener('popstate', fire);
  window.addEventListener('load', fire);
})();
</script>
